<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ailem</title>
<style>
  :root{
    --zemin:#e9f1f5; --kart:#ffffff; --yazi:#12303d; --yumusak:#4a6572;
    --vurgu:#1f6f8b; --cizgi:#c5d8e1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --zemin:#10222b; --kart:#183440; --yazi:#f2f8fa; --yumusak:#b4cbd5; --vurgu:#7cc4de; --cizgi:#2c5463; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--zemin); color:var(--yazi);
    font-family:Verdana, "Trebuchet MS", system-ui, sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header{padding:22px 20px 8px}
  h1{margin:0;font-size:1.9rem;line-height:1.2}
  header p{margin:6px 0 0;color:var(--yumusak);font-size:1.1rem}
  main{display:flex;flex-direction:column;gap:16px;padding:16px 16px 40px;max-width:640px;margin:0 auto}
  .kisi{
    display:flex;align-items:center;gap:18px;width:100%;
    background:var(--kart);border:2px solid var(--cizgi);border-radius:22px;
    padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  }
  .kisi:focus-visible{outline:4px solid var(--vurgu);outline-offset:3px}
  .foto{
    flex:none;width:116px;height:116px;border-radius:50%;object-fit:cover;
    background:var(--vurgu);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:2.8rem;font-weight:700;overflow:hidden;
  }
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .ad{font-size:1.9rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
  .yakin{font-size:1.4rem;color:var(--vurgu);margin-top:6px;font-weight:600}
  dialog{
    border:none;border-radius:26px;padding:28px 22px;width:min(92vw,520px);
    background:var(--kart);color:var(--yazi);text-align:center;
  }
  dialog::backdrop{background:rgba(8,20,26,.75)}
  dialog .foto{width:min(70vw,280px);height:min(70vw,280px);margin:0 auto 18px;font-size:6rem}
  dialog .ad{font-size:2.4rem}
  dialog .yakin{font-size:1.8rem}
  dialog button{
    margin-top:24px;font:inherit;font-size:1.3rem;padding:14px 34px;border-radius:999px;
    border:none;background:var(--vurgu);color:#fff;cursor:pointer;
  }
  @media (prefers-color-scheme: dark){ dialog button{color:#10222b;font-weight:700} }
</style>
</head>
<body>
<header>
  <h1>Ailem</h1>
  <p>Evde yanında olan insanlar</p>
</header>
<main id="liste"></main>

<dialog id="buyuk">
  <div id="icerik"></div>
  <button id="kapat" type="button">Kapat</button>
</dialog>

<script>
/* ============ BURAYI KENDİNİZE GÖRE DÜZENLEYİN ============
   ad      : kişinin adı
   yakinlik: kayınvalidenizin gözünden yazın ("Senin kızın" gibi)
   foto    : fotograflar/ klasörüne yüklediğiniz dosyanın adı
             (foto yoksa baş harfi gösterilir)
=============================================================== */
const KISILER = [
  { ad: "Ayşe", yakinlik: "Senin kızın",     foto: "fotograflar/ayse.jpg" },
  { ad: "Mehmet", yakinlik: "Senin damadın", foto: "fotograflar/mehmet.jpg" },
  { ad: "Elif", yakinlik: "Senin torunun",   foto: "fotograflar/elif.jpg" }
];

const liste = document.getElementById("liste");
const buyuk = document.getElementById("buyuk");
const icerik = document.getElementById("icerik");

function fotoKutusu(k){
  const d = document.createElement("div");
  d.className = "foto";
  d.textContent = k.ad.trim().charAt(0).toLocaleUpperCase("tr");
  if (k.foto){
    const img = new Image();
    img.alt = k.ad;
    img.onload = () => { d.textContent = ""; d.appendChild(img); };
    img.src = k.foto;
  }
  return d;
}
function metin(k){
  const m = document.createElement("div");
  const a = document.createElement("div"); a.className = "ad"; a.textContent = k.ad;
  const y = document.createElement("div"); y.className = "yakin"; y.textContent = k.yakinlik;
  m.append(a, y);
  return m;
}

KISILER.forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "kisi";
  b.append(fotoKutusu(k), metin(k));
  b.addEventListener("click", () => {
    icerik.replaceChildren(fotoKutusu(k), metin(k));
    buyuk.showModal();
  });
  liste.appendChild(b);
});
document.getElementById("kapat").addEventListener("click", () => buyuk.close());
buyuk.addEventListener("click", e => { if (e.target === buyuk) buyuk.close(); });
</script>
</body>
</html>
